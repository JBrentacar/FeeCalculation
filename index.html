<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>料金シミュレーション - JBレンタカー石巻店</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: #f0f4f8;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, #0068e9, #0051b5);
            padding: 20px 16px 24px;
            text-align: center;
            color: white;
        }

        header img { max-width: 90px; margin-bottom: 8px; }
        header h1 { font-size: 19px; font-weight: 700; letter-spacing: .05em; }
        header p { font-size: 13px; opacity: .85; margin-top: 4px; }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 14px 60px;
        }

        /* カード */
        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            padding: 22px 18px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i { color: #0068e9; }

        /* フィールド */
        .field-group { margin-bottom: 14px; }

        .field-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin-bottom: 6px;
        }

        .field-group input,
        .field-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dde3ec;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            background: #fafbfd;
            transition: border-color .2s, box-shadow .2s;
            -webkit-appearance: none;
        }

        .field-group input:focus,
        .field-group select:focus {
            outline: none;
            border-color: #0068e9;
            box-shadow: 0 0 0 3px rgba(0,104,233,.15);
            background: white;
        }

        /* 車両画像 */
        .car-image-wrap {
            display: none;
            text-align: center;
            margin: 4px 0 14px;
        }

        .car-image-wrap img {
            max-width: 100%;
            max-height: 130px;
            border-radius: 10px;
            border: 1.5px solid #eee;
        }

        .car-image-caption {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            line-height: 1.5;
        }

        /* オプションチェック */
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f7f9fc;
            border: 1.5px solid #e8edf5;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }

        .option-item:has(input:checked) {
            border-color: #0068e9;
            background: #eef5ff;
        }

        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #0068e9;
            flex-shrink: 0;
            cursor: pointer;
        }

        .option-label {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            flex: 1;
        }

        .option-info {
            color: #bbb;
            font-size: 13px;
            cursor: pointer;
        }

        /* ツールチップ */
        .tooltip-wrap { position: relative; display: inline-block; }

        .tooltip-box {
            display: none;
            position: absolute;
            right: 0;
            bottom: calc(100% + 6px);
            background: #333;
            color: white;
            font-size: 12px;
            border-radius: 8px;
            padding: 8px 12px;
            width: 200px;
            line-height: 1.6;
            z-index: 10;
            font-weight: 400;
        }

        .tooltip-box.show { display: block; }

        /* 送信ボタン */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0068e9, #0051b5);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,104,233,.35);
            transition: transform .2s, box-shadow .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:active {
            transform: scale(.98);
            box-shadow: 0 2px 6px rgba(0,104,233,.3);
        }

        /* 結果カード */
        .result-card {
            display: none;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            padding: 22px 18px;
            margin-bottom: 16px;
        }

        .result-card.visible { display: block; }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f4f8;
            font-size: 14px;
        }

        .result-row:last-of-type { border-bottom: none; }
        .result-label { color: #777; }
        .result-value { font-weight: 700; color: #333; }

        .total-block {
            background: linear-gradient(135deg, #0068e9, #0051b5);
            border-radius: 12px;
            padding: 16px 18px;
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .total-block .label { font-size: 14px; opacity: .9; }
        .total-block .amount { font-size: 24px; font-weight: 700; }

        .inquiry-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ffc600, #f4a100);
            color: #333;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            padding: 15px;
            border-radius: 12px;
            margin-top: 14px;
            box-shadow: 0 4px 12px rgba(255,198,0,.4);
            transition: transform .2s;
        }

        .inquiry-btn:active { transform: scale(.98); }

        /* エラー */
        .err { color: #e74c3c; font-size: 12px; margin-top: 4px; display: none; }

        footer {
            background: linear-gradient(135deg, #0068e9, #0051b5);
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 13px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="JBレンタカー石巻店">
    <h1>料金シミュレーション</h1>
    <p>ご利用条件を入力してお見積もり</p>
</header>

<main>

    <form id="rentalForm" onsubmit="event.preventDefault(); calculate();">

        <!-- 基本情報 -->
        <div class="form-card">
            <div class="card-title"><i class="fas fa-calendar-alt"></i> 基本情報</div>

            <div class="field-group">
                <label>ご利用開始日</label>
                <input type="date" id="startDate" required>
                <div class="err" id="errDate">利用開始日を選択してください</div>
            </div>

            <div class="field-group">
                <label>ご利用日数</label>
                <input type="number" id="days" min="1" max="365" value="7" step="1">
                <div class="err" id="errDays">7日以上で入力してください</div>
            </div>

            <div class="field-group">
                <label>車両クラス</label>
                <select id="carClass" required onchange="updateCarImage()">
                    <option value="">選択してください</option>
                    <option value="J-1">J-1：軽自動車（2ドア）</option>
                    <option value="J-2">J-2：軽自動車（4ドア）</option>
                    <option value="J-3">J-3：軽貨物バン</option>
                    <option value="J-4">J-4：小型乗用車</option>
                </select>
                <div class="err" id="errCar">車両クラスを選択してください</div>
            </div>

            <div class="car-image-wrap" id="carImageWrap">
                <img id="carImage" src="" alt="">
                <div class="car-image-caption" id="carCaption"></div>
            </div>
        </div>

        <!-- オプション -->
        <div class="form-card">
            <div class="card-title"><i class="fas fa-plus-circle"></i> オプション</div>
            <div class="option-grid">

                <label class="option-item">
                    <input type="checkbox" id="insurance">
                    <span class="option-label">車両保険</span>
                    <span class="option-info tooltip-wrap">
                        <i class="fas fa-info-circle" onclick="tipToggle(event,'tip-ins')"></i>
                        <div class="tooltip-box" id="tip-ins">損傷や事故に対する保険です。</div>
                    </span>
                </label>

                <label class="option-item">
                    <input type="checkbox" id="waiver">
                    <span class="option-label">免責補償</span>
                    <span class="option-info tooltip-wrap">
                        <i class="fas fa-info-circle" onclick="tipToggle(event,'tip-waiver')"></i>
                        <div class="tooltip-box" id="tip-waiver">事故時の自己負担額を軽減します。</div>
                    </span>
                </label>

                <label class="option-item">
                    <input type="checkbox" id="tires">
                    <span class="option-label">スタッドレス</span>
                    <span class="option-info tooltip-wrap">
                        <i class="fas fa-info-circle" onclick="tipToggle(event,'tip-tires')"></i>
                        <div class="tooltip-box" id="tip-tires">雪道・凍結路での安全走行に。</div>
                    </span>
                </label>

                <label class="option-item">
                    <input type="checkbox" id="etc">
                    <span class="option-label">ETC</span>
                    <span class="option-info tooltip-wrap">
                        <i class="fas fa-info-circle" onclick="tipToggle(event,'tip-etc')"></i>
                        <div class="tooltip-box" id="tip-etc">高速料金所をスムーズに通過。ETCカードは別途ご用意ください。</div>
                    </span>
                </label>

                <label class="option-item" style="grid-column: span 2;">
                    <input type="checkbox" id="gps">
                    <span class="option-label">カーナビ</span>
                    <span class="option-info tooltip-wrap">
                        <i class="fas fa-info-circle" onclick="tipToggle(event,'tip-gps')"></i>
                        <div class="tooltip-box" id="tip-gps">目的地への道順を案内します。</div>
                    </span>
                </label>

            </div>
        </div>

        <button type="submit" class="submit-btn">
            <i class="fas fa-calculator"></i> 見積もりを計算する
        </button>

    </form>

    <!-- 結果 -->
    <div class="result-card" id="resultCard">
        <div class="card-title"><i class="fas fa-receipt"></i> お見積もり結果</div>
        <div id="resultRows"></div>
        <div class="total-block">
            <span class="label">合計金額（税込）</span>
            <span class="amount" id="totalAmount">―</span>
        </div>
        <a href="https://jb-rentacar.com/miyagi/#contact" target="_blank" class="inquiry-btn">
            <i class="fas fa-calendar-check"></i> 空き状況を確認する
        </a>
    </div>

</main>

<footer>
    &copy; 2025 JBレンタカー石巻店<br>
    0120-204-625
</footer>

<script>
    const rateTable = {
        "J-1": [1980,3960,5940,7700,7700,7700,7700,9680,11660,13640,15400,15400,15400,15400,17380,19360,21340,23100,23100,23100,23100,23940,23940,23940,23940,23940,23940,23940,23940,23940],
        "J-2": [2480,4960,7440,9600,9600,9600,9600,12080,14560,17040,19200,19200,19200,19200,21680,24160,26640,28800,28800,28800,28800,29580,29580,29580,29580,29580,29580,29580,29580,29580],
        "J-3": [3180,6360,9540,12720,13400,13400,13400,16580,19760,22940,26120,26800,26800,26800,29980,33160,36340,39500,39500,39500,39500,39500,39500,39500,39500,39500,39500,39500,39500,39500],
        "J-4": [3380,6760,10140,13520,16900,17480,17480,20860,24240,27620,31000,34380,34960,34960,38340,39800,39800,39800,39800,39800,39800,39800,39800,39800,39800,39800,39800,39800,39800,39800],
        "ETC_NAV":    [500,1000,1000,1000,1000,1000,1000,1500,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000,2000],
        "INS_WAIVER": [1000,2000,2000,2000,2000,2000,2000,3000,4000,4000,4000,4000,4000,4000,5000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000],
        "WINTER_TIRES":[1000,2000,3000,3000,3000,3000,3000,4000,5000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000,6000]
    };

    const carDescriptions = {
        "J-1": "コンパクトで市街地や狭い道に最適",
        "J-2": "乗り降りしやすい4ドア軽自動車",
        "J-3": "荷物が多い方に。後部を倒せば大型荷物も可",
        "J-4": "快適な乗り心地と十分な荷室スペース"
    };

    // 初期値セット
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
    });

    function updateCarImage() {
        const val = document.getElementById('carClass').value;
        const wrap = document.getElementById('carImageWrap');
        if (val) {
            document.getElementById('carImage').src = val.replace('-', '') + '.png';
            document.getElementById('carCaption').textContent = carDescriptions[val] || '';
            wrap.style.display = 'block';
        } else {
            wrap.style.display = 'none';
        }
    }

    function tipToggle(e, id) {
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll('.tooltip-box.show').forEach(el => {
            if (el.id !== id) el.classList.remove('show');
        });
        document.getElementById(id).classList.toggle('show');
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.tooltip-box.show').forEach(el => el.classList.remove('show'));
    });

    function calcTotal(days, key) {
        let total = 0, rem = days;
        while (rem > 0) {
            const d = Math.min(rem, 30);
            total += rateTable[key][d - 1] || 0;
            rem -= d;
        }
        return total;
    }

    function fmtDate(d) {
        const dow = ['日','月','火','水','木','金','土'][d.getDay()];
        return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dow}）`;
    }

    function row(label, value) {
        return `<div class="result-row"><span class="result-label">${label}</span><span class="result-value">${value}</span></div>`;
    }

    function calculate() {
        let ok = true;

        const startVal = document.getElementById('startDate').value;
        const days     = parseInt(document.getElementById('days').value, 10);
        const carClass = document.getElementById('carClass').value;

        document.getElementById('errDate').style.display = (!startVal) ? 'block' : 'none';
        if (!startVal) ok = false;

        document.getElementById('errDays').style.display = (isNaN(days) || days < 1) ? 'block' : 'none';
        if (isNaN(days) || days < 1) ok = false;

        document.getElementById('errCar').style.display = (!carClass) ? 'block' : 'none';
        if (!carClass) ok = false;

        if (!ok) return;

        const ins    = document.getElementById('insurance').checked;
        const waiver = document.getElementById('waiver').checked;
        const tires  = document.getElementById('tires').checked;
        const etc    = document.getElementById('etc').checked;
        const gps    = document.getElementById('gps').checked;

        const base    = calcTotal(days, carClass);
        const insCost = ins    ? calcTotal(days, 'INS_WAIVER') : 0;
        const wvCost  = waiver ? calcTotal(days, 'INS_WAIVER') : 0;
        const tireCost= tires  ? calcTotal(days, 'WINTER_TIRES') : 0;
        const etcCost = etc    ? calcTotal(days, 'ETC_NAV') : 0;
        const gpsCost = gps    ? calcTotal(days, 'ETC_NAV') : 0;

        const subtotal = base + insCost + wvCost + tireCost + etcCost + gpsCost;
        const tax      = Math.round(subtotal * 0.1);
        const total    = subtotal + tax;

        const start  = new Date(startVal);
        const ret    = new Date(startVal);
        ret.setDate(start.getDate() + days);

        const carLabel = document.getElementById('carClass').options[document.getElementById('carClass').selectedIndex].text;

        let html = '';
        html += row('ご利用開始日', fmtDate(start));
        html += row('ご返却日',     fmtDate(ret));
        html += row('ご利用日数',   `${days}日間`);
        html += row('選択車両',     carLabel);
        html += row('基本料金',     `¥${base.toLocaleString()}`);
        if (ins)    html += row('車両保険',          `¥${insCost.toLocaleString()}`);
        if (waiver) html += row('免責補償',          `¥${wvCost.toLocaleString()}`);
        if (tires)  html += row('スタッドレスタイヤ',`¥${tireCost.toLocaleString()}`);
        if (etc)    html += row('ETC',               `¥${etcCost.toLocaleString()}`);
        if (gps)    html += row('カーナビ',          `¥${gpsCost.toLocaleString()}`);
        html += row('小計', `¥${subtotal.toLocaleString()}`);
        html += row('消費税（10%）', `¥${tax.toLocaleString()}`);

        document.getElementById('resultRows').innerHTML = html;
        document.getElementById('totalAmount').textContent = `¥${total.toLocaleString()}`;

        const card = document.getElementById('resultCard');
        card.classList.add('visible');
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    }
</script>

</body>
</html>
