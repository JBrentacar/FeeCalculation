<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>料金シミュレーション - JBレンタカー石巻店</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: #f0f4f8;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(135deg, #0068e9, #0051b5);
      padding: 20px 16px 24px;
      text-align: center;
      color: white;
    }

    header img { max-width: 90px; margin-bottom: 8px; }
    header h1 { font-size: 19px; font-weight: 700; letter-spacing: .05em; }
    header p { font-size: 13px; opacity: .85; margin-top: 4px; }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 14px 60px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #999;
      letter-spacing: .1em;
      margin: 0 4px 12px;
    }

    .sim-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      padding: 22px 20px;
      margin-bottom: 14px;
      text-decoration: none;
      color: #333;
      display: block;
      transition: transform .2s, box-shadow .2s;
    }

    .sim-card:active {
      transform: scale(.98);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    .sim-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .sim-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      flex-shrink: 0;
    }

    .icon-blue   { background: linear-gradient(135deg, #0068e9, #0051b5); }
    .icon-yellow { background: linear-gradient(135deg, #ffc600, #f4a100); }

    .sim-card-name {
      font-size: 17px;
      font-weight: 700;
      color: #333;
    }

    .sim-card-sub {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }

    .sim-features {
      list-style: none;
      padding: 0;
      margin-bottom: 16px;
    }

    .sim-features li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      padding: 5px 0;
      border-bottom: 1px solid #f0f4f8;
    }

    .sim-features li:last-child { border-bottom: none; }
    .sim-features li i { color: #0068e9; width: 14px; }

    .sim-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #0068e9, #0051b5);
    }

    .sim-btn.yellow {
      background: linear-gradient(135deg, #ffc600, #f4a100);
      color: #333;
    }

    footer {
      background: linear-gradient(135deg, #0068e9, #0051b5);
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<header>
  <img src="jblogo.png" alt="JBレンタカー石巻店">
  <h1>料金シミュレーション</h1>
  <p>プランを選んでお見積もり</p>
</header>

<main>

  <div class="section-label">シミュレーターを選択</div>

  <a href="https://jbrentacar.github.io/FeeCalculation/QuickSimulator.html" class="sim-card">
    <div class="sim-card-header">
      <div class="sim-icon icon-yellow"><i class="fas fa-bolt"></i></div>
      <div>
        <div class="sim-card-name">30日プラン見積もり</div>
        <div class="sim-card-sub">かんたん・すぐわかる</div>
      </div>
    </div>
    <ul class="sim-features">
      <li><i class="fas fa-check"></i>30日間の料金を即時表示</li>
      <li><i class="fas fa-check"></i>車両クラスを選ぶだけ</li>
      <li><i class="fas fa-check"></i>オプションのON/OFF切り替え</li>
    </ul>
    <div class="sim-btn yellow"><i class="fas fa-arrow-right"></i> 30日プランを見積もる</div>
  </a>

  <a href="https://jbrentacar.github.io/FeeCalculation/" class="sim-card">
    <div class="sim-card-header">
      <div class="sim-icon icon-blue"><i class="fas fa-calculator"></i></div>
      <div>
        <div class="sim-card-name">くわしく見積もり</div>
        <div class="sim-card-sub">日数・開始日を自由に設定</div>
      </div>
    </div>
    <ul class="sim-features">
      <li><i class="fas fa-check"></i>利用日数を自由に入力</li>
      <li><i class="fas fa-check"></i>開始日・返却日を確認</li>
      <li><i class="fas fa-check"></i>オプションも含めて合計計算</li>
    </ul>
    <div class="sim-btn"><i class="fas fa-arrow-right"></i> くわしく見積もる</div>
  </a>

</main>

<footer>
  &copy; 2025 JBレンタカー石巻店<br>
  0120-204-625
</footer>

</body>
</html>
